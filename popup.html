<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 300px;
      padding: 16px;
      background: #fff;
      color: #1a1a1a;
    }
    h2 { font-size: 15px; margin-bottom: 12px; color: #0a66c2; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    input:focus { outline: none; border-color: #0a66c2; }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-primary { background: #0a66c2; color: #fff; }
    .btn-primary:hover { background: #004182; }
    .btn-secondary { background: #f3f3f3; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }
    .status {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 4px;
      display: none;
    }
    .status.success { background: #e6f4ea; color: #1e7e34; display: block; }
    .status.error { background: #fdecea; color: #c0392b; display: block; }
    .hint { font-size: 11px; color: #888; margin-top: 6px; }
    a { color: #0a66c2; }
    hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
  </style>
</head>
<body>
  <h2>LinkedIn Profile Capture</h2>

  <label for="sheetId">Google Sheet ID</label>
  <input type="text" id="sheetId" placeholder="Paste your Sheet ID here" />
  <p class="hint">
    From the sheet URL: docs.google.com/spreadsheets/d/<strong>&lt;SHEET_ID&gt;</strong>/edit
  </p>

  <hr />

  <button class="btn-primary" id="saveBtn">Save Sheet ID</button>
  <button class="btn-secondary" id="signInBtn">Sign in with Google</button>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
